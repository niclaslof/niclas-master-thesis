name: Build LaTeX Thesis

on:
  push:
    branches: [main]
    paths:
      - 'thesis/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: thesis/main.tex
          working_directory: .
          latexmk_use_xelatex: false

      - name: Move PDF to site
        run: |
          mkdir -p site/public
          cp thesis/main.pdf site/public/thesis.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: site/public/thesis.pdf

      - name: Commit PDF to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/thesis.pdf
          git diff --staged --quiet || git commit -m "chore: update compiled thesis PDF"
          git push
